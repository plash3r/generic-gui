name: gui

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Format and tests
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
      - name: Freestanding Generic userspace binary
        run: |
          cargo build -p generic-gui-user --target x86_64-unknown-none --release
          readelf -h target/x86_64-unknown-none/release/generic-gui-user
          readelf -l target/x86_64-unknown-none/release/generic-gui-user
